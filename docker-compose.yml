services:
  postgres:
    image: postgres:16-alpine
    container_name: medilink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink_dev
      POSTGRES_DB: medilink
    ports:
      - "5432:5432"
    volumes:
      - medilink_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: medilink-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - medilink_redis:/data

volumes:
  medilink_pgdata:
  medilink_redis:
